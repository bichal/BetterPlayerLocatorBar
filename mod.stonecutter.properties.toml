# Better Player Locator Bar build configuration. Merged at configuration time with
# ../Bichal-build-logic/common.stonecutter.properties.toml (Bichal.settings):
# any table declared here replaces the common table of the same name.

[mod]
id = "bplb"
name = "Better Player Locator Bar"
group = "net.bichal"
package = "net.bichal.bplb"
version = "1.1.1"
authors = "Bichal"
description = "Adds a HUD bar above the experience bar that shows the direction of other players."
side = "BOTH"
issues = "https://github.com/bichal/BetterPlayerLocatorBar/issues"

# The mod keeps its own licence (not the common AGPL/CC pair).
[legal]
holder = "Bichal"
code = "CC-BY-NC-SA-4.0"
assets = "CC-BY-NC-SA-4.0"

[publish]
client_side = "required"
server_side = "optional"

[ci]
gradle_tasks = "build buildAndCollect"

# One node per Minecraft version whose game code differs enough to need its own
# build. NeoForge never released 1.21.6, 1.21.7 and 1.21.9: Fabric only there.
[stonecutter]
versions = ["1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.2", "26.3"]
loaders = ["neoforge", "fabric"]
fabric_only = ["1.21.6", "1.21.7", "1.21.9"]
vcs_version = "1.21.1"

# Classes the game renamed; the sources are written for 1.21.1.
[stonecutter.replace.identifier]
since = "1.21.11"
from = "ResourceLocation"
to = "Identifier"

# 26.1 replaced immediate-mode GuiGraphics with GuiGraphicsExtractor.
[stonecutter.replace.gui_graphics]
since = "26.1"
from = "GuiGraphics"
to = "GuiGraphicsExtractor"

[stonecutter.replace.draw_string]
since = "26.1"
from = ".drawString("
to = ".text("

[stonecutter.replace.draw_centered_string]
since = "26.1"
from = ".drawCenteredString("
to = ".centeredText("

# 26.2: the locator bar renderer lost its suffix and setScreen became setScreenAndShow.
[stonecutter.replace.locator_bar]
since = "26.2"
from = "LocatorBarRenderer"
to = "LocatorBar"

[stonecutter.replace.set_screen]
since = "26.2"
from = ".setScreen("
to = ".setScreenAndShow("

