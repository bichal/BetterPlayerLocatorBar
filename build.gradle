plugins {
    id 'fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = project.version

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url = "https://maven.shedaniel.me/"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases/"
    }
}

dependencies {
    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

def modVersion = version
def archiveName = base.archivesName.get()

processResources {
    inputs.property("version", modVersion)

    filesMatching("fabric.mod.json") {
        expand(version: modVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}




jar {
    inputs.property("archivesName", archiveName)

    from("LICENSE") {
        rename { "${it}_${archiveName}" }
    }
}
