# Managed by panzer-build-logic (shared/mod/gradle.properties): `panzer sync`
# overwrites this file. Per-machine settings (memory, workers) belong in
# ~/.gradle/gradle.properties.
#
# -Xmx4G: Stonecutter runs several Minecraft-version projects plus NeoForge's
# tooling in one daemon. ParallelGC: a build needs throughput, not short pauses.
org.gradle.jvmargs=-Xmx4G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
