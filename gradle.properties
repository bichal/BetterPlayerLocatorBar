# Trabajando duro para la maxima flexibilidad (y un poco de caos (pronto tódo acabara))

# Gradle
org.gradle.jvmargs=-Xms1G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:+PerfDisableSharedMem -Dfile.encoding=UTF-8 -Djava.awt.headless=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache.problems=warn
org.gradle.workers.max=6
org.gradle.console=rich
org.gradle.warning.mode=all

